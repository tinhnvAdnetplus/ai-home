# AI HOME PLATFORM — Laragon nginx vhost
#
# Cài đặt: copy file này vào C:/laragon/etc/nginx/sites-enabled/ai-home.test.conf
#          (hoặc chạy `make laragon-install`), rồi Laragon > Menu > Nginx > Reload.
#
# KHÔNG đặt tiền tố "auto." cho tên file: Laragon chỉ ghi đè các file auto.*.conf.
# Project nằm ngoài DocumentRoot của Laragon nên vhost này phải khai báo thủ công.

server {
    listen 8080;
    server_name ai-home.test *.ai-home.test;
    root "D:/project/php/8.4/ai-home/apps/api/public";

    index index.php index.html;
    charset utf-8;

    client_max_body_size 64M;

    # Laravel serve luôn SPA React: mọi URL không phải file tĩnh đều đi qua index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;   # php-cgi của Laragon (127.0.0.1:10987)
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    error_log  logs/ai-home.error.log;
    access_log logs/ai-home.access.log;
}
