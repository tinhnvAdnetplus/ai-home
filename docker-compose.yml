# ====================================================================================
# NGỪNG SỬ DỤNG (legacy) — môi trường local đã chuyển sang Laragon.
#
#   - Hạ tầng hiện tại: nginx 1.30.4 + php-cgi (PHP 8.3) + mailpit 1.22.3 của Laragon.
#   - vhost nginx:      laragon/nginx/ai-home.test.conf  (cài bằng `laragon\dev.ps1 install-site`)
#   - Task runner:      laragon/dev.ps1   (tương đương các lệnh `make` cũ)
#   - Hướng dẫn:        README.local.md
#
# File này chỉ còn để tham khảo cấu hình cũ (MySQL 8.4, mailpit, nginx, vite, queue)
# và KHÔNG chạy được: các Dockerfile ở docker/api, docker/web, docker/nginx không tồn tại
# trong repo. Makefile bản Docker được giữ ở Makefile.docker.bak.
# ====================================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    container_name: aihome_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    environment:
      TZ: Asia/Tokyo
      MYSQL_DATABASE: ${DB_DATABASE:-aihome}
      MYSQL_USER: ${DB_USERNAME:-aihome}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aihome_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-aihome_root_dev}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - aihome-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: aihome_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - aihome-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aihome_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "AI HOME"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-aihome}
      DB_PASSWORD: ${DB_PASSWORD:-aihome_dev}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      QUEUE_CONNECTION: database
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    networks:
      - aihome-network
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/artisan && SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 300s # first boot downloads Laravel via composer

  nginx:
    image: nginx:1.27-alpine
    container_name: aihome_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aihome-network
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dev-only: Vite dev server for React HMR. Production needs no Node and a single PHP port
  # (React is built into apps/api/public/build and served by Laravel, see `make build`).
  vite:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: aihome_vite
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      npm_config_store_dir: /pnpm-store # keep the pnpm store off the host bind mount
      VITE_DEV_ORIGIN: ${VITE_DEV_ORIGIN:-http://localhost:5173}
    volumes:
      - .:/app
      - vite_node_modules:/app/node_modules
      - vite_app_node_modules:/app/apps/api/node_modules
      - pnpm_store:/pnpm-store
    networks:
      - aihome-network
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/@vite/client || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  queue:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aihome_queue
    restart: unless-stopped
    working_dir: /var/www/html
    profiles:
      - queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    environment:
      APP_NAME: "AI HOME"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aihome}
      DB_USERNAME: ${DB_USERNAME:-aihome}
      DB_PASSWORD: ${DB_PASSWORD:-aihome_dev}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      QUEUE_CONNECTION: database
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    networks:
      - aihome-network
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging

volumes:
  db_data:
  api_vendor:
  vite_node_modules:
  vite_app_node_modules:
  pnpm_store:

networks:
  aihome-network:
    driver: bridge
